name: Pull And Push To Aliyun
on:
  workflow_dispatch:
  push:
    paths:
      - 'images.txt'
env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check docker version
        run: docker --version
      - name: 开始执行任务
        uses: actions/checkout@v4
      - name: docker镜像同步任务
        run: |
          echo "➡️ 从images.txt获取最新镜像数据"
          # mapfile读取全部行，兼容无末尾换行
          mapfile -t IMAGE_LIST < images.txt
          # 过滤空行
          IMAGE_LIST=($(for line in "${IMAGE_LIST[@]}"; do echo "$line"; done | sed '/^[[:space:]]*$/d'))
          TOTAL=${#IMAGE_LIST[@]}
          echo "✅ 获取成功，共${TOTAL}条："
          for line in "${IMAGE_LIST[@]}"; do
            echo "      $line"
          done

          mkdir -p docker_hub

          echo "➡️ 正在登录阿里容器镜像仓库"
          docker login -u $ALIYUN_REGISTRY_USER -p $ALIYUN_REGISTRY_PASSWORD $ALIYUN_REGISTRY
          echo "✅ 阿里容器镜像仓库登录完成"

          INDEX=1
          for SOURCE_IMG in "${IMAGE_LIST[@]}"; do
            echo "➡️ 拉取第${INDEX}条数据：${SOURCE_IMG}"
            docker pull "${SOURCE_IMG}"
            echo "✅ 镜像拉取成功"

            IMG_NAME=$(echo "$SOURCE_IMG" | sed 's/\//_/g')
            TARGET_IMG="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/${IMG_NAME}"
            SAVE_FILE="docker_hub/${IMG_NAME}.tar"

            echo "➡️ 正在保存镜像到文件：${SAVE_FILE}"
            docker save -o "${SAVE_FILE}" "${SOURCE_IMG}"
            echo "✅ 镜像已保存到 ${SAVE_FILE}"

            echo "➡️ 正在上传第${INDEX}条镜像：${SOURCE_IMG}"
            docker tag "${SOURCE_IMG}" "${TARGET_IMG}"
            docker push "${TARGET_IMG}"
            echo "✅ 镜像上传到阿里容器镜像仓库成功"

            echo "✅ 清理缓存成功"
            docker rmi "${SOURCE_IMG}" || true
            docker rmi "${TARGET_IMG}" || true

            INDEX=$((INDEX+1))
          done
          echo "🎉 所有任务已完成"

name: Pull And Push To Aliyun
on:
  workflow_dispatch: # 保留：支持网页手动执行
  push:
    paths:
      - 'images.txt'  # images.txt文件变更自动触发
env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check docker version
        run: docker --version

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录阿里云ACR镜像仓库
        run: |
          echo "正在登录阿里云容器镜像仓库"
          docker login -u $ALIYUN_REGISTRY_USER -p $ALIYUN_REGISTRY_PASSWORD $ALIYUN_REGISTRY
          echo "✅ 阿里云仓库登录完成"

      # ========== 第一个镜像 bestrui/octopus:v0.9.28 ==========
      - name: 拉取镜像 bestrui/octopus:v0.9.28
        run: |
          echo "开始拉取 bestrui/octopus:v0.9.28"
          docker pull bestrui/octopus:v0.9.28
          echo "✅ bestrui/octopus:v0.9.28 拉取成功"

      - name: 标记并推送到阿里云
        run: |
          SOURCE_IMG="bestrui/octopus:v0.9.28"
          TARGET_IMG="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/bestrui_octopus:v0.9.28"
          echo "开始打标签：$SOURCE_IMG -> $TARGET_IMG"
          docker tag $SOURCE_IMG $TARGET_IMG
          echo "开始推送到阿里云ACR"
          docker push $TARGET_IMG
          echo "✅ bestrui/octopus:v0.9.28 推送阿里云成功"

      - name: 清理本地镜像 bestrui/octopus:v0.9.28
        if: always()
        run: |
          echo "清理本地镜像 bestrui/octopus:v0.9.28"
          docker rmi bestrui/octopus:v0.9.28 || true
          echo "✅ 本地镜像清理完毕"

      # ========== 第二个镜像 decolua/9router:latest ==========
      - name: 拉取镜像 decolua/9router:latest
        run: |
          echo "开始拉取 decolua/9router:latest"
          docker pull decolua/9router:latest
          echo "✅ decolua/9router:latest 拉取成功"

      - name: 标记并推送到阿里云
        run: |
          SOURCE_IMG="decolua/9router:latest"
          TARGET_IMG="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/decolua_9router:latest"
          echo "开始打标签：$SOURCE_IMG -> $TARGET_IMG"
          docker tag $SOURCE_IMG $TARGET_IMG
          echo "开始推送到阿里云ACR"
          docker push $TARGET_IMG
          echo "✅ decolua/9router:latest 推送阿里云成功"

      - name: 清理本地镜像 decolua/9router:latest
        if: always()
        run: |
          echo "清理本地镜像 decolua/9router:latest"
          docker rmi decolua/9router:latest || true
          echo "✅ 本地镜像清理完毕"
